name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Create Clean Cordova Project & Build
      run: |
        # 1. Fresh Cordova app create karein
        cordova create myapp com.rahulgupta.duckshooter2 "Duck Shooter 3D"
        cd myapp

        # 2. Hamari files copy karein
        rm -rf www/*
        cp -r ../www/* www/
        cp ../config.xml .

        # 3. Android platform add karein
        cordova platform add android@12.0.1

        # 4. AdMob plugin add karein (aapki App ID ke saath)
        cordova plugin add cordova-plugin-admob-plus --variable APP_ID_ANDROID="ca-app-pub-1590363558146928~5915974911"

        # 5. Build Android APK
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DuckShooter-APK
        path: myapp/platforms/android/app/build/outputs/apk/debug/*.apk
